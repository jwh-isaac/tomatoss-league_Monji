<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토마토스 몬지 리그</title>
<meta name="theme-color" content="#e8443a">
<style>
  :root{
    --red:#e8443a; --red-d:#c2312a; --red-l:#fde8e6; --green:#3f9b4f;
    --bg:#fff8f5; --card:#ffffff; --text:#2b1d1a; --sub:#8a706b; --line:#f0dcd7;
    --gold:#f2b632;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  header{background:var(--red);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:20px;letter-spacing:-.3px}
  header p{margin:4px 0 0;font-size:12px;opacity:.85}
  nav{display:flex;background:var(--red-d)}
  nav button{flex:1;border:0;background:none;color:#ffd9d5;padding:11px 0;font-size:15px;font-weight:600}
  nav button.on{color:#fff;box-shadow:inset 0 -3px 0 #fff}
  main{max-width:560px;margin:0 auto;padding:14px 16px 90px}
  section{display:none} section.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
  input[type=date],input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .row{display:flex;gap:8px}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--red-l);color:var(--red-d)}
  .btn.primary{background:var(--red);color:#fff}
  .btn:disabled{opacity:.45}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:15px}
  .chip.sel{background:var(--red);border-color:var(--red);color:#fff}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .p{border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;font-size:16px;font-weight:600;background:#fff;position:relative}
  .p.win{border-color:var(--gold);background:#fff8e3}
  .p .pts{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:2px}
  .p.win .pts{color:#a87400;font-weight:700}
  .p.win::before{content:"👑";position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:16px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar .btn{width:100%;max-width:528px;display:block;margin:0 auto;padding:14px;font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right}
  td.rk{text-align:center;width:36px;font-weight:700}
  tr.top1 td.rk{color:#c99400} tr.top2 td.rk{color:#8c8c8c} tr.top3 td.rk{color:#b5703a}
  td.pt{font-weight:800;color:var(--red-d)}
  .game{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .game:last-child{border-bottom:0}
  .game .meta{font-size:12px;color:var(--sub)}
  .game .who{font-size:14px;margin-top:3px;line-height:1.5}
  .game .who b{color:#a87400}
  .del{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 6px;flex-shrink:0}
  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#2b1d1a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90%}
  .toast.show{opacity:.95}
  .empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
  .sum{display:flex;gap:8px;margin-bottom:12px}
  .sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .sum b{display:block;font-size:20px;color:var(--red-d)} .sum span{font-size:12px;color:var(--sub)}
  .tiebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .tog{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--sub)}
  .tog.on{border-color:var(--gold);background:#fff3cc;color:#8a5f00}
  .p.tie{border-color:#e7b94a;border-style:dashed}
  .p input.hs{width:100%;margin-top:8px;font-size:16px;padding:7px 6px;text-align:center;border:1px solid var(--line);border-radius:8px}
  .p .pick{display:none;margin-top:6px;border:0;border-radius:8px;background:#fff3cc;color:#8a5f00;font-size:13px;font-weight:700;padding:6px;width:100%}
  .tiebox{display:none;background:#fff8e3;border:1px solid #f3dc9b;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5a00;margin-top:10px;line-height:1.5}
  .tag{display:inline-block;font-size:11px;font-weight:700;background:#fff3cc;color:#8a5f00;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
  .tb{font-size:12px;color:#8a5f00;margin-top:3px}
</style>
</head>
<body>
<header>
  <h1>🍅 토마토스 몬지 리그</h1>
  <p>1위 = 참가 인원수만큼 · 나머지 = 참가점 1점 · 전 기록 누적</p>
</header>
<nav>
  <button data-tab="input" class="on">점수 입력</button>
  <button data-tab="rank">순위</button>
  <button data-tab="log">기록</button>
</nav>

<main>
  <!-- 입력 -->
  <section id="input" class="on">
    <div class="card">
      <h2>모임일자</h2>
      <input type="date" id="date">
    </div>

    <div class="card">
      <h2>① 이번 판 참가자 선택</h2>
      <div class="chips" id="known"></div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="newName" placeholder="새 참가자 이름" maxlength="20" autocomplete="off">
        <button class="btn" id="addBtn">추가</button>
      </div>
      <div class="hint">같은 테이블이 연속으로 하면 선택이 유지됩니다. 닉네임은 매번 같게 입력해 주세요.</div>
    </div>

    <div class="card">
      <div class="tiebar">
        <h2 style="margin:0" id="step2">② 1위 터치 (<span id="cnt">0</span>명 참가)</h2>
        <button class="tog" id="tieBtn">1위 동점</button>
      </div>
      <div class="plist" id="sel"></div>
      <div class="empty" id="selEmpty">참가자를 먼저 선택하세요</div>
      <div class="tiebox" id="tieBox"></div>
    </div>
  </section>

  <!-- 순위 -->
  <section id="rank">
    <div class="sum">
      <div><b id="sGames">-</b><span>총 판수</span></div>
      <div><b id="sPlayers">-</b><span>참가 인원</span></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="text-align:center">#</th><th>플레이어</th><th>승점</th><th>1위</th><th>판수</th></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
      <div class="empty" id="rankEmpty">아직 기록이 없습니다</div>
    </div>
    <button class="btn" style="width:100%" onclick="load(true)">새로고침</button>
  </section>

  <!-- 기록 -->
  <section id="log">
    <div class="card">
      <h2>최근 50판</h2>
      <div id="logList"></div>
      <div class="empty" id="logEmpty">아직 기록이 없습니다</div>
    </div>
  </section>
</main>

<div class="bar" id="bar"><button class="btn primary" id="saveBtn" disabled>저장</button></div>
<div class="toast" id="toast"></div>

<script>
/* ▼▼ Apps Script 웹앱 배포 URL 붙여넣기 ▼▼ */
const SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
/* 타이브레이커 방향: true = 손패 합계가 낮은 사람이 1위 / false = 높은 사람이 1위 */
const TIE_LOWER_WINS = false;
/* ▲▲ ▲▲ */

const $ = id => document.getElementById(id);
let state = { players: [], ranking: [], recent: [], totalGames: 0 };
let selected = [];   // 이번 판 참가자 (순서 유지)
let winner = '';
let tieMode = false;
let tied = {};       // 동점자 이름 → 손패 합계(문자열)
let manualPick = ''; // 손패 합계까지 같을 때 직접 지정한 1위
let localNames = [];
try { localNames = JSON.parse(localStorage.getItem('monjiNames') || '[]'); } catch (e) {}

function todayKST() {
  const d = new Date(Date.now() + 9 * 3600e3);
  return d.toISOString().slice(0, 10);
}
$('date').value = todayKST();

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* 탭 */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.tab));
  $('bar').style.display = b.dataset.tab === 'input' ? '' : 'none';
  if (b.dataset.tab !== 'input') load();
});

/* 참가자 */
function allNames() {
  return [...new Set([...state.players, ...localNames, ...selected])].sort((a, b) => a.localeCompare(b, 'ko'));
}
function renderKnown() {
  const names = allNames();
  $('known').innerHTML = names.length
    ? names.map(n => `<button class="chip ${selected.includes(n) ? 'sel' : ''}" data-n="${esc(n)}">${esc(n)}</button>`).join('')
    : '<span class="hint" style="margin:0">첫 모임입니다. 아래에서 이름을 추가하세요.</span>';
  $('known').querySelectorAll('.chip').forEach(c => c.onclick = () => toggle(c.dataset.n));
}
function toggle(n) {
  if (selected.includes(n)) { selected = selected.filter(x => x !== n); if (winner === n) winner = ''; delete tied[n]; }
  else selected.push(n);
  render();
}
function addName() {
  const n = $('newName').value.trim().replace(/\s+/g, ' ');
  if (!n) return;
  if (!localNames.includes(n)) {
    localNames.push(n);
    try { localStorage.setItem('monjiNames', JSON.stringify(localNames)); } catch (e) {}
  }
  if (!selected.includes(n)) selected.push(n);
  $('newName').value = '';
  render();
}
$('addBtn').onclick = addName;
$('newName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addName(); } });

/* 동점 모드 토글 */
$('tieBtn').onclick = () => {
  tieMode = !tieMode;
  tied = {}; manualPick = ''; winner = '';
  render();
};

/* 동점자 손패 합계로 1위 계산 → { ready, unresolved, best:[이름...] } */
function tieResult() {
  const names = Object.keys(tied);
  if (names.length < 2) return { ready: false, msg: '1위 동점자를 2명 이상 터치하세요' };
  const vals = names.map(nm => [nm, tied[nm]]);
  if (vals.some(([, v]) => v === '' || !Number.isFinite(Number(v)) || Number(v) < 0))
    return { ready: false, msg: '동점자 손패 합계를 모두 입력하세요' };
  const nums = vals.map(([nm, v]) => [nm, Number(v)]);
  const target = TIE_LOWER_WINS ? Math.min(...nums.map(x => x[1])) : Math.max(...nums.map(x => x[1]));
  const best = nums.filter(x => x[1] === target).map(x => x[0]);
  return { ready: true, unresolved: best.length > 1, best };
}

function updateTie() {
  const r = tieResult();
  if (!r.ready) winner = '';
  else if (!r.unresolved) winner = r.best[0];
  else winner = r.best.includes(manualPick) ? manualPick : '';

  const n = selected.length;
  $('sel').querySelectorAll('.p').forEach(el => {
    const nm = el.dataset.n, isTie = nm in tied;
    el.classList.toggle('tie', isTie);
    el.classList.toggle('win', nm === winner);
    el.querySelector('.pts').textContent = nm === winner ? `+${n}점` : '+1점';
    const pick = el.querySelector('.pick');
    if (pick) pick.style.display = r.ready && r.unresolved && r.best.includes(nm) ? 'block' : 'none';
  });

  const box = $('tieBox');
  box.style.display = 'block';
  const rule = TIE_LOWER_WINS ? '낮은' : '높은';
  if (!r.ready) box.innerHTML = `1위 동점자를 터치한 뒤, 각자 <b>손에 남은 토마토 카드 숫자 합계</b>를 입력하세요.<br>합계가 ${rule} 사람이 1위가 됩니다.`;
  else if (r.unresolved && !winner) box.innerHTML = `손패 합계도 같습니다 (${r.best.map(esc).join(', ')}).<br>현장 판정 후 <b>👑 1위 지정</b> 버튼을 눌러 주세요.`;
  else box.innerHTML = `타이브레이커 결과: <b>${esc(winner)}</b> 1위 (손패 합계 ${rule} 쪽)`;
  updateSave(r);
}

function updateSave(r) {
  const n = selected.length;
  const ok = n >= 2 && !!winner;
  $('saveBtn').disabled = !ok;
  let label;
  if (ok) label = `저장 (${winner} 1위 · ${n}인${tieMode ? ' · 동점' : ''})`;
  else if (n < 2) label = '참가자 2명 이상 선택';
  else if (tieMode) label = r && r.msg ? r.msg : '동점 1위를 지정하세요';
  else label = '1위를 터치하세요';
  $('saveBtn').textContent = label;
}

function renderSel() {
  const n = selected.length;
  $('cnt').textContent = n;
  $('selEmpty').style.display = n ? 'none' : '';
  $('tieBtn').classList.toggle('on', tieMode);
  $('tieBtn').textContent = tieMode ? '동점 모드 ON' : '1위 동점';
  $('step2').firstChild.textContent = tieMode ? '② 1위 동점자 터치 (' : '② 1위 터치 (';

  if (!tieMode) {
    $('tieBox').style.display = 'none';
    $('sel').innerHTML = selected.map(p =>
      `<div class="p ${p === winner ? 'win' : ''}" data-n="${esc(p)}">${esc(p)}<span class="pts">${p === winner ? '+' + n + '점' : '+1점'}</span></div>`
    ).join('');
    $('sel').querySelectorAll('.p').forEach(el => el.onclick = () => { winner = el.dataset.n === winner ? '' : el.dataset.n; render(); });
    updateSave();
    return;
  }

  /* 동점 모드: 카드 터치 = 동점자 지정/해제, 동점자는 손패 합계 입력칸 표시 */
  $('sel').innerHTML = selected.map(p => {
    const isTie = p in tied;
    return `<div class="p ${isTie ? 'tie' : ''}" data-n="${esc(p)}">${esc(p)}<span class="pts">+1점</span>` +
      (isTie ? `<input class="hs" type="number" inputmode="numeric" min="0" placeholder="손패 합계" value="${esc(tied[p])}">
                <button class="pick" type="button">👑 1위 지정</button>` : '') + `</div>`;
  }).join('');
  $('sel').querySelectorAll('.p').forEach(el => {
    const nm = el.dataset.n;
    el.onclick = e => {
      if (e.target.closest('input,.pick')) return;
      if (nm in tied) delete tied[nm]; else tied[nm] = '';
      if (manualPick === nm) manualPick = '';
      renderSel();
      const inp = $('sel').querySelector(`.p[data-n="${CSS.escape(nm)}"] input`);
      if (inp) inp.focus();
    };
    const inp = el.querySelector('input');
    if (inp) inp.oninput = () => { tied[nm] = inp.value.trim(); manualPick = ''; updateTie(); };
    const pick = el.querySelector('.pick');
    if (pick) pick.onclick = () => { manualPick = nm; updateTie(); };
  });
  updateTie();
}
function render() { renderKnown(); renderSel(); }

/* 서버 통신 */
async function api(body) {
  if (SCRIPT_URL.startsWith('PASTE')) throw new Error('SCRIPT_URL을 설정하세요');
  const res = body
    ? await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    : await fetch(SCRIPT_URL + '?t=' + Date.now());
  const data = await res.json();
  if (data.ok === false) throw new Error(data.error || '오류');
  return data;
}
let loading = false;
async function load(showToast) {
  if (loading) return; loading = true;
  try { state = await api(); renderAll(); if (showToast) toast('최신 순위로 갱신했습니다'); }
  catch (e) { toast('불러오기 실패: ' + e.message); }
  finally { loading = false; }
}

$('saveBtn').onclick = async () => {
  const n = selected.length;
  const tie = tieMode ? Object.keys(tied).map(nm => ({ name: nm, sum: Number(tied[nm]) })) : [];
  const tieLine = tie.length
    ? `\n[1위 동점 · 손패 합계] ${tie.map(t => `${t.name} ${t.sum}`).join(' / ')}${tieResult().unresolved ? ' (합계 동일 → 현장 판정)' : ''}`
    : '';
  if (!confirm(`${$('date').value}\n${n}인 게임 · 1위 ${winner} (+${n}점)\n나머지 ${n - 1}명 +1점${tieLine}\n\n저장할까요?`)) return;
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '저장 중...';
  try {
    state = await api({ date: $('date').value, players: selected, winner, tie });
    winner = '';               // 같은 멤버로 다음 판 바로 입력 가능
    tieMode = false; tied = {}; manualPick = '';
    renderAll();
    toast('저장 완료! 다음 판 1위를 선택하세요');
  } catch (e) { toast('저장 실패: ' + e.message); renderSel(); }
};

async function delGame(id, label) {
  if (!confirm(`이 판을 삭제할까요?\n${label}`)) return;
  try { state = await api({ action: 'delete', gameId: id }); renderAll(); toast('삭제했습니다'); }
  catch (e) { toast('삭제 실패: ' + e.message); }
}

/* 렌더 */
function renderAll() {
  render();
  $('sGames').textContent = state.totalGames;
  $('sPlayers').textContent = state.ranking.length;
  $('rankEmpty').style.display = state.ranking.length ? 'none' : '';
  $('rankBody').innerHTML = state.ranking.map(s =>
    `<tr class="${s.rank <= 3 ? 'top' + s.rank : ''}"><td class="rk">${s.rank}</td><td>${esc(s.name)}</td><td class="pt">${s.points}</td><td>${s.wins}</td><td>${s.games}</td></tr>`
  ).join('');
  $('logEmpty').style.display = state.recent.length ? 'none' : '';
  $('logList').innerHTML = state.recent.map(g => {
    const others = g.players.filter(p => p !== g.winner).map(esc).join(', ');
    const label = `${g.date} ${g.n}인 · 1위 ${g.winner}`;
    const tie = g.tie || [];
    const tieHtml = tie.length
      ? `<div class="tb">🍅 동점 타이브레이커(손패 합계): ${tie.map(t => `${esc(t.name)} ${t.sum}`).join(' / ')}</div>` : '';
    return `<div class="game"><div><div class="meta">${esc(g.date)} · ${g.n}인${tie.length ? '<span class="tag">1위 동점</span>' : ''}</div>
      <div class="who">👑 <b>${esc(g.winner)}</b> +${g.n} / ${others} +1</div>${tieHtml}</div>
      <button class="del" data-id="${esc(g.id)}" data-l="${esc(label)}">삭제</button></div>`;
  }).join('');
  $('logList').querySelectorAll('.del').forEach(b => b.onclick = () => delGame(b.dataset.id, b.dataset.l));
}

render();
load();
</script>
</body>
</html>
